<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Permite utilizar tildes, ñ y caracteres especiales. -->
    <meta charset="utf-8" />

    <!-- Icono pequeño mostrado en la pestaña del navegador. -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Permite adaptar correctamente el contenido a celulares y tablets. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <!-- Color principal utilizado por algunos navegadores móviles. -->
    <meta
      name="theme-color"
      content="#b89573"
    />

    <!-- Descripción utilizada por buscadores y al compartir el sitio. -->
    <meta
      name="description"
      content="Plataforma oficial de El Ancla Comunidad Cristiana. Consulta actividades, reuniones, horarios, recursos y novedades de nuestra comunidad."
    />

    <!-- Información sobre la organización responsable del sitio. -->
    <meta
      name="author"
      content="El Ancla Comunidad Cristiana"
    />

    <!-- Permite que los buscadores indexen las páginas del sitio. -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Icono utilizado al guardar la plataforma en dispositivos Apple. -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Archivo con la configuración de instalación de la futura PWA. -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Título mostrado en la pestaña del navegador. -->
    <title>El Ancla Comunidad Cristiana</title>
  </head>

  <body>
    <!-- Mensaje mostrado cuando JavaScript está desactivado. -->
    <noscript>
      Necesitas habilitar JavaScript para utilizar la plataforma de El Ancla.
    </noscript>

    <!-- React insertará toda la aplicación dentro de este elemento. -->
    <div id="root"></div>
  </body>
</html>
